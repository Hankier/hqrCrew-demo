<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<title>hqrCrew</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%2309090b'/%3E%3Crect x='3' y='3' width='5' height='5' fill='%23e8a33d'/%3E%3Crect x='8' y='8' width='5' height='5' fill='%23e8a33d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* hqrCrew board · Calm HUD.
   Structure is neutral, accent is state: amber = needs you / waiting, green = good (running, PASS, preview up),
   burgundy = blocked or failed, violet = previews. 3px corners, hairlines, no shadows except status glows. */
:root{
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Geist","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Geist Mono","Cascadia Code",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
  --gold:#e8a33d; --gold-hi:#ffd08a; --gold-deep:#8a5f1f;
  --green:#5f9b72; --green-hi:#8cc59d;
  --burgundy:#c1556b; --burgundy-hi:#e39aa8;
  --violet:#8b7ec8; --violet-hi:#bcb2ec;
  --page:#09090b; --page-hi:#141317; --t:228,228,231;
  --ink:#f4f4f5; --ink-2:#d4d4d8; --muted:#a1a1aa; --helper:#8b8b94;
  --panel:rgba(var(--t),.025); --tile:rgba(var(--t),.04); --field:rgba(0,0,0,.32);
  --line:rgba(var(--t),.14); --line-soft:rgba(var(--t),.08); --grid:rgba(var(--t),.045);
  --accent:var(--gold); --accent-hi:var(--gold-hi); --accent-deep:var(--gold-deep);
  --f1:14.5px; --r:3px; --bar:52px;
  --g:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --barh:53px; --chatw:360px; --drawer:600px;
  --sheet:#0d0d10;
  color-scheme:dark;
}
[data-zone="amber"]{--accent:var(--gold);--accent-hi:var(--gold-hi);--accent-deep:var(--gold-deep)}
[data-zone="green"]{--accent:#74b78a;--accent-hi:#a8dcbb;--accent-deep:#33654a}
[data-zone="violet"]{--accent:var(--violet);--accent-hi:var(--violet-hi);--accent-deep:#4b4283}
[data-zone="burgundy"]{--accent:var(--burgundy);--accent-hi:var(--burgundy-hi);--accent-deep:#6d2f3c}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--page-hi) 0,var(--page) 520px);color:var(--ink);font:400 var(--f1)/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 45%);mask-image:linear-gradient(180deg,#000,transparent 45%)}
b,strong{font-weight:600;color:var(--ink)}
a{color:var(--accent-hi);text-decoration-color:color-mix(in srgb,var(--accent) 50%,transparent);text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent-hi)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,h5,h6{margin:0;font-weight:600;color:var(--ink)}
p,ul,ol,blockquote,table,figure,pre{margin:0}
.mono{font-family:var(--mono)}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--helper)}
.muted{color:var(--muted)}
.helper{color:var(--helper)}
.small{font-size:13px;line-height:1.5}
.grow{flex:1 1 auto}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
::selection{background:rgba(232,163,61,.3)}
*{scrollbar-width:thin;scrollbar-color:rgba(var(--t),.16) transparent}

/* status dots (template .st) */
.st{display:inline-flex;align-items:baseline;gap:7px;font:500 12.5px/1.3 var(--mono);color:var(--ink-2)}
.st::before{content:"";width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--muted);transform:translateY(-1px)}
.st.yes::before{background:var(--green-hi);box-shadow:0 0 8px var(--green-hi)}
.st.yes{color:var(--green-hi)}
.st.part::before{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.st.part{color:var(--gold-hi)}
.st.no::before{background:transparent;border:1px dashed var(--muted)}
.st.risk::before{background:var(--burgundy-hi);box-shadow:0 0 8px var(--burgundy-hi)}
.st.risk{color:var(--burgundy-hi)}
.st.pv::before{background:var(--violet-hi);box-shadow:0 0 8px var(--violet)}
.st.pv{color:var(--violet-hi)}
.st.pulse::before{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:var(--r);padding:7px 12px;font:500 11.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background .12s ease,border-color .12s ease}
.btn:hover{background:var(--tile);border-color:rgba(var(--t),.26)}
.btn.acc{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent-hi)}
.btn.acc:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.btn.solid{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.btn.solid:hover{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.go{border-color:var(--green);background:rgba(95,155,114,.12);color:var(--green-hi)}
.btn.go:hover{background:rgba(95,155,114,.2)}
.btn.danger{border-color:var(--burgundy);background:rgba(193,85,107,.1);color:var(--burgundy-hi)}
.btn.danger:hover{background:rgba(193,85,107,.18)}
.btn.big{min-height:44px;padding:10px 18px;font-size:12.5px}
.btn[aria-busy="true"]{opacity:.65}
.ibtn{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border:1px solid var(--line-soft);border-radius:var(--r);background:transparent;color:var(--ink-2);font:400 20px/1 var(--sans);padding:0}
.ibtn:hover{background:var(--tile);border-color:var(--line)}
.linkbtn{border:0;background:none;padding:2px 4px;color:var(--accent-hi);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
textarea,input[type="text"],select{font:400 15px/1.45 var(--sans);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-height:42px;width:100%;transition:border-color .12s ease}
textarea{resize:vertical;display:block}
textarea::placeholder,input::placeholder{color:#71717a}
textarea:focus,input[type="text"]:focus,select:focus{border-color:rgba(var(--t),.32)}
textarea:focus-visible,input[type="text"]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{width:auto;padding-right:30px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg>button{min-height:38px;padding:0 13px;border:0;background:transparent;color:var(--muted);font:500 13px/1.2 var(--sans);white-space:nowrap}
.seg>button+button{border-left:1px solid var(--line)}
.seg>button:hover{color:var(--ink-2);background:var(--panel)}
.seg>button[aria-pressed="true"]{background:rgba(var(--t),.09);color:var(--ink)}
.seg>button:focus-visible{outline-offset:-2px}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--line-soft);border-radius:2px;font:500 10.5px/1.45 var(--mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:40;background:rgba(9,9,11,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .in{display:flex;align-items:center;gap:10px;min-height:var(--bar);padding:6px var(--gr) 6px var(--g)}
.brand{display:inline-flex;align-items:center;gap:7px;min-height:40px;font:600 12.5px/1 var(--mono);letter-spacing:.02em;text-transform:none;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--gold);filter:drop-shadow(0 0 6px rgba(232,163,61,.6))}
.proj{flex:0 1 auto;min-width:0;padding-left:11px;border-left:1px solid var(--line-soft);font:400 13px/1.3 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projsel{font:500 12.5px/1.2 var(--mono);color:var(--ink-2);background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;max-width:190px;min-height:32px}
.runchip{display:inline-flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;max-width:340px;min-height:34px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--field);font:500 12px/1.2 var(--mono);color:var(--ink-2)}
.runchip:hover{border-color:rgba(var(--t),.26)}
.runchip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--helper)}
.runchip .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runchip .caret{flex:none;color:var(--helper);font-size:10px}
.runchip[data-tone="run"]{border-color:rgba(95,155,114,.55);color:var(--green-hi)}
.runchip[data-tone="run"] .dot{background:var(--green-hi);box-shadow:0 0 8px var(--green-hi);animation:pulse 2.4s ease-in-out infinite}
.runchip[data-tone="wait"]{border-color:rgba(232,163,61,.5);color:var(--gold-hi)}
.runchip[data-tone="wait"] .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.runchip[data-tone="risk"]{border-color:rgba(193,85,107,.65);color:var(--burgundy-hi)}
.runchip[data-tone="risk"] .dot{background:var(--burgundy-hi);box-shadow:0 0 8px var(--burgundy-hi)}
.meters{display:flex;gap:6px;flex:none}
.meter{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 8px;border:1px solid var(--line-soft);border-radius:var(--r);background:transparent;font:500 11.5px/1 var(--mono);color:var(--ink-2)}
.meter:hover{border-color:var(--line)}
.meter .m-l{color:var(--helper)}
.meter .m-bar{position:relative;width:32px;height:4px;border-radius:2px;background:rgba(var(--t),.1);overflow:hidden}
.meter .m-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink-2)}
.meter.wait .m-bar i{background:var(--gold)} .meter.wait .m-v{color:var(--gold-hi)}
.meter.risk .m-bar i{background:var(--burgundy-hi)} .meter.risk .m-v{color:var(--burgundy-hi)}
.pvs{display:flex;gap:6px;flex:0 1 auto;min-width:0;overflow:hidden}
.pvchip{display:inline-flex;align-items:center;gap:7px;flex:0 1 auto;min-width:0;overflow:hidden;min-height:34px;padding:4px 9px;border:1px solid rgba(95,155,114,.45);border-radius:var(--r);font:500 11.5px/1 var(--mono);color:var(--green-hi);text-decoration:none;white-space:nowrap}
.pvchip:hover{background:rgba(95,155,114,.1)}
.pvchip.busy{border-color:rgba(232,163,61,.45);color:var(--gold-hi)}
.pvchip .st::before{width:7px;height:7px}
.pvchip .pv-t{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.pvchip>span:not(.pv-t){flex:none}
.labchip{display:inline-flex;align-items:center;gap:7px;flex:none;min-height:34px;padding:4px 9px;border:1px solid var(--line);border-radius:var(--r);background:transparent;font:500 11.5px/1 var(--mono);color:var(--ink-2);white-space:nowrap}
.labchip:hover{background:var(--tile)}
.labchip .dot{flex:none;width:7px;height:7px;border-radius:50%;border:1px dashed var(--muted)}
.labchip .lt{color:var(--muted)}
.labchip[data-tone="up"]{border-color:rgba(95,155,114,.45);color:var(--green-hi)}
.labchip[data-tone="up"] .dot{border:0;background:var(--green-hi);box-shadow:0 0 6px var(--green-hi)}
.labchip[data-tone="busy"]{border-color:rgba(232,163,61,.45);color:var(--gold-hi)}
.labchip[data-tone="busy"] .dot{border:0;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:pulse 1.6s ease-in-out infinite}
.labchip[data-tone="bad"]{border-color:rgba(193,85,107,.6);color:var(--burgundy-hi)}
.labchip[data-tone="bad"] .dot{border:0;background:var(--burgundy-hi);box-shadow:0 0 6px var(--burgundy-hi)}
.labchip[aria-expanded="true"]{background:var(--tile);border-color:rgba(var(--t),.28)}
.live{display:inline-flex;align-items:center;gap:6px;flex:none;font:500 11px/1 var(--mono);color:var(--helper);white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:var(--helper)}
.live[data-state="live"] i{background:var(--green-hi);box-shadow:0 0 6px var(--green-hi)}
.live[data-state="reconnecting"]{color:var(--gold-hi)}
.live[data-state="reconnecting"] i{background:var(--gold);box-shadow:0 0 6px var(--gold);animation:pulse 1.2s ease-in-out infinite}
.topbtn{position:relative;min-height:36px}
.topbtn .ico{font:400 17px/1 var(--sans);letter-spacing:0;margin-top:-1px}
.topbtn svg{flex:none}
.topbtn .cdot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;border:2px solid var(--page);display:none}
.topbtn.busy .cdot{display:block;background:var(--green-hi);box-shadow:0 0 6px var(--green-hi);animation:pulse 1.6s ease-in-out infinite}
.topbtn.unread .cdot{display:block;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:none}
.topbtn[aria-expanded="true"]{background:var(--tile);border-color:rgba(var(--t),.28);color:var(--ink)}
.brk{display:none}

/* ---- runner menu ---- */
.menu{position:fixed;z-index:65;top:60px;left:16px;width:min(352px,calc(100vw - 32px));max-height:calc(100dvh - 80px);overflow:auto;padding:16px;background:#111114;border:1px solid var(--line);border-radius:var(--r)}
.menu>*+*{margin-top:14px}
.menu .rm-line{font:500 13px/1.45 var(--mono)}
.menu .rm-detail{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:6px}
.menu .seg{display:flex}
.menu .seg>button{flex:1}
.menu .rm-hint{font-size:12.5px;color:var(--helper);margin-top:8px}
.usage{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font:400 12.5px/1.3 var(--mono);color:var(--ink-2)}
.usage .ub{height:4px;border-radius:2px;background:rgba(var(--t),.1);position:relative;overflow:hidden}
.usage .ub i{position:absolute;inset:0 auto 0 0;background:var(--ink-2);border-radius:2px}
.usage .ub.wait i{background:var(--gold)} .usage .ub.risk i{background:var(--burgundy-hi)}
.usage .ur{grid-column:2/4;margin-top:-4px;color:var(--helper);font-size:11.5px}
.rm-facts{list-style:none;padding:0;font-size:13px;color:var(--muted);line-height:1.5}
.rm-facts li+li{margin-top:4px}
.rm-btns{display:flex;flex-wrap:wrap;gap:8px}
/* lab menu: same shell as the runner menu */
.lab-sec>*+*{margin-top:12px}
.lab-sec+.lab-sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
.lab-sec .pv-open{min-height:48px;padding:10px 12px}
.lab-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.lab-sec .logins li{display:flex;gap:10px}
.lab-sec .logins .role{flex:none;min-width:58px;color:var(--helper)}
.lab-sec .pv-err{margin-top:0}

/* ---- app shell ---- */
.app{position:relative}
.main{position:relative;min-width:0;container-type:inline-size;container-name:board}
.tabs{display:none}
/* --cols and --n come from the board model (renderBoard), so a new column needs no CSS change. */
.board{display:grid;grid-template-columns:var(--cols,minmax(150px,1fr) minmax(184px,1.3fr) repeat(4,minmax(150px,1fr)));gap:8px;padding:12px var(--gr) 12px var(--g);min-height:0}
.board-msg{grid-column:1/-1;padding:40px 0;text-align:center;font:italic 400 17px/1.5 var(--serif);color:var(--muted)}
.board-msg .btn{margin-top:14px;font-style:normal}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel);position:relative}
.col-head{flex:none;padding:10px 12px 9px;border-bottom:1px solid var(--line-soft)}
.col-title{display:flex;align-items:baseline;gap:8px;font:600 13.5px/1.25 var(--sans);color:var(--ink)}
.col-title .n{font:500 12px/1 var(--mono);color:var(--helper)}
.col-hint{margin-top:3px;font-size:12px;line-height:1.35;color:var(--helper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px;display:flex;flex-direction:column;gap:8px}
.col.you{border-color:rgba(232,163,61,.38);background:rgba(232,163,61,.035)}
.col.you::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,var(--gold),transparent 85%)}
.col.you .col-title{color:var(--gold-hi)}
.col.you .col-title .n{color:var(--gold)}
.col.you .col-hint{color:rgba(255,208,138,.62)}

/* cards */
.card{display:block;position:relative;padding:10px 11px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(22,21,26,.8);color:var(--ink);text-decoration:none;overflow-wrap:anywhere;transition:border-color .12s ease,background .12s ease}
.card:hover{border-color:rgba(var(--t),.22);background:rgba(30,29,35,.9)}
.card.sel{border-color:rgba(var(--t),.42);background:rgba(34,33,40,.95)}
.card.blocked{border-left:2px solid var(--burgundy);padding-left:10px}
.card.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%{border-color:rgba(var(--t),.62);background:rgba(var(--t),.09)}}
.card:focus-visible{outline-offset:1px}
.c-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:500 11.5px/1.3 var(--mono);color:var(--helper)}
.c-top .id{color:var(--ink-2);letter-spacing:.02em}
.c-top .pos{margin-left:auto}
.mk{display:inline-block;padding:0 5px;border-radius:2px;font:500 10.5px/1.5 var(--mono);white-space:nowrap}
.mk.p1{color:var(--gold-hi);border:1px solid rgba(232,163,61,.5)}
.mk.rn{color:var(--green-hi);border:1px solid rgba(95,155,114,.5)}
.c-title{margin-top:6px;font:500 14px/1.4 var(--sans);color:var(--ink)}
.c-needs{margin-top:6px;font:400 13px/1.42 var(--sans);color:var(--gold-hi);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:3px 10px;font:400 11.5px/1.4 var(--mono);color:var(--helper)}
.c-meta .ok{color:var(--green-hi)}
.c-meta .bad{color:var(--burgundy-hi)}
.c-meta .warn{color:var(--gold-hi)}
.c-meta .c-step{color:var(--green-hi)}
.c-meta .c-step::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green-hi);box-shadow:0 0 6px var(--green-hi);margin-right:6px;transform:translateY(-1px);animation:pulse 1.8s ease-in-out infinite}
/* design-round badge: amber = a round to read, green = designing or accepted, burgundy = failed */
.c-meta .dzb{color:var(--ink-2)}
.c-meta .dzb::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:6px;transform:translateY(-1px)}
.c-meta .dzb.t-ready{color:var(--gold-hi)}
.c-meta .dzb.t-ready::before{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.c-meta .dzb.t-run,.c-meta .dzb.t-ok{color:var(--green-hi)}
.c-meta .dzb.t-run::before{background:var(--green-hi);box-shadow:0 0 6px var(--green-hi);animation:pulse 1.8s ease-in-out infinite}
.c-meta .dzb.t-ok::before{background:var(--green-hi)}
.c-meta .dzb.t-bad{color:var(--burgundy-hi)}
.c-meta .dzb.t-bad::before{background:var(--burgundy-hi);box-shadow:0 0 6px var(--burgundy-hi)}
.c-meta .dzb.t-idle{color:var(--helper)}
.c-meta .dzb.t-idle::before{background:transparent;border:1px dashed var(--muted)}
.empty{margin:2px 0;padding:18px 12px;border:1px dashed var(--line-soft);border-radius:var(--r);font:italic 400 15px/1.45 var(--serif);color:var(--helper);text-align:center}
.col.you .empty{color:var(--muted)}

/* parked */
.parked{margin:0 var(--gr) 12px var(--g);border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel)}
.parked summary{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;cursor:pointer;list-style:none;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--helper)}
.parked summary::-webkit-details-marker{display:none}
.parked summary::before{content:"▸";font-size:11px;color:var(--helper);transition:transform .12s ease}
.parked[open] summary::before{transform:rotate(90deg)}
.parked summary b{font-weight:500;color:var(--ink-2)}
.parked summary .ph{letter-spacing:0;text-transform:none;font-family:var(--sans);font-size:12.5px;color:var(--helper)}
.parked-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:0 12px 12px;max-height:34vh;overflow:auto}

/* ---- chat ---- */
.chat{display:flex;flex-direction:column;min-height:0;background:#0c0c0f;border-left:1px solid var(--line);position:relative}
.chat-head{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px 6px 16px;border-bottom:1px solid var(--line-soft)}
.chat-head h2{font:500 21px/1 var(--serif);letter-spacing:-.01em}
.chat-head .chat-meta{font:400 11.5px/1.2 var(--mono);color:var(--helper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chat-log{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 10px}
.msgs,.pend{display:flex;flex-direction:column;gap:10px}
.pend:not(:empty){margin-top:10px}
.msg{max-width:88%;padding:9px 12px;border:1px solid var(--line-soft);border-radius:var(--r);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:rgba(var(--t),.075);border-color:var(--line)}
.msg.lead{align-self:flex-start;background:rgba(var(--t),.02)}
.msg.err{border-color:rgba(193,85,107,.6);background:rgba(193,85,107,.06)}
.msg.pending{opacity:.72}
.msg.pending.err{opacity:1}
.msg-meta{margin-top:5px;font:400 11px/1.3 var(--mono);color:var(--helper)}
.msg.me .msg-meta{text-align:right}
.msg.err .msg-meta{color:var(--burgundy-hi)}
.sys{display:flex;gap:9px;align-items:baseline;padding:1px 2px;font:400 12px/1.5 var(--mono);color:var(--helper)}
.sys .sys-when{flex:none;color:#6b6b74}
.sys .sys-text{min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sys a.tid{color:var(--ink-2)}
.day{align-self:center;padding:4px 0;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#6b6b74}
.chat-empty{padding:28px 10px;text-align:center;font:italic 400 16px/1.5 var(--serif);color:var(--muted)}
.typing{margin-top:12px;max-width:88%;padding:9px 12px;border:1px dashed rgba(95,155,114,.45);border-radius:var(--r);overflow-wrap:anywhere}
.typing .st{font-size:11.5px}
.typing .partial{margin-top:6px;color:var(--muted)}
.typing .tools{margin-top:6px;display:flex;flex-direction:column;gap:2px;font:400 11.5px/1.45 var(--mono);color:var(--helper)}
.typing .tool{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newmsg{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;z-index:2;min-height:34px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);background:#17171b;color:var(--ink-2);font:500 11.5px/1 var(--mono)}
.chat-form{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line-soft)}
.chat-form textarea{flex:1;min-height:42px;max-height:180px;resize:none;overflow-y:auto}
.chat-form .btn{min-height:42px}
.chat-hint{flex:none;padding:0 12px 10px;font:400 11px/1.3 var(--mono);color:#6b6b74}

/* ---- markdown ---- */
.md{color:var(--ink-2);font-size:15px;line-height:1.6;overflow-wrap:break-word}
.md>*+*{margin-top:10px}
.md h3{font:600 16.5px/1.35 var(--sans);color:var(--ink)}
.md h4{font:600 15px/1.35 var(--sans);color:var(--ink)}
.md h5,.md h6{font:500 11.5px/1.35 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--helper)}
.md *+h3,.md *+h4,.md *+h5{margin-top:18px}
.md ul,.md ol{padding-left:22px}
.md li+li{margin-top:5px}
.md li>ul,.md li>ol{margin-top:5px}
.md li::marker{color:var(--helper)}
.md code{font-family:var(--mono);font-size:.86em;background:var(--tile);border:1px solid var(--line-soft);border-radius:var(--r);padding:0 5px;color:var(--ink);white-space:pre-wrap}
.md pre.code{background:var(--field);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 12px;overflow-x:auto;font:400 12.5px/1.55 var(--mono);color:var(--ink-2)}
.md pre.code code{background:none;border:0;padding:0;font-size:inherit;white-space:pre}
.md blockquote{padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line-soft)}
.md a{overflow-wrap:anywhere}
.md a.tid{font-family:var(--mono);font-size:.92em}
.md .tick{display:inline-block;width:12px;height:12px;margin-right:7px;border:1px solid var(--muted);border-radius:2px;vertical-align:-1px}
.md .tick.on{background:var(--green);border-color:var(--green)}
.tbl{overflow-x:auto;min-width:0;border-top:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 12px 9px 0;border-bottom:1px solid var(--line-soft)}
.tbl th{font:500 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--helper);white-space:nowrap}
.tbl td{color:var(--ink-2);min-width:64px}
.tbl td.n{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--ink)}
.chat-md{font-size:14.5px;line-height:1.55}
.chat-md>*+*{margin-top:8px}

/* ---- ticket drawer ---- */
.drawer{position:fixed;z-index:50;top:var(--barh);right:0;bottom:0;width:min(var(--drawer),calc(100vw - 48px));display:flex;flex-direction:column;background:var(--sheet);border-left:1px solid var(--line)}
.dr-head{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px;padding:6px 10px 6px 20px;border-bottom:1px solid var(--line-soft)}
.dr-head .back{order:10;margin-left:auto}
.dr-id{font:600 13px/1 var(--mono);letter-spacing:.03em;color:var(--ink)}
.dr-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 56px}
.dr-loading{padding:30px 0;font:italic 400 17px/1.5 var(--serif);color:var(--muted)}
.dr-loading .btn{margin-top:14px;font-style:normal}
.dr-title{font:500 27px/1.2 var(--serif);letter-spacing:-.01em;color:var(--ink);overflow-wrap:break-word;outline:none}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font:400 12px/1.45 var(--mono);color:var(--helper)}
.facts .hot{color:var(--gold-hi)}
.dr-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
.branch{display:inline-flex;align-items:center;gap:4px;min-width:0;font:400 12.5px/1.4 var(--mono);color:var(--ink-2);overflow-wrap:anywhere}
.branch .copy{min-height:32px;padding:4px 8px;border:1px solid var(--line-soft);border-radius:var(--r);background:none;color:var(--helper);font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.branch .copy:hover{color:var(--ink-2);border-color:var(--line)}
.diffstat{font:400 12px/1.4 var(--mono);color:var(--helper)}
.blk{margin-top:18px;padding:14px 14px 15px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel);position:relative}
.blk>*+*{margin-top:12px}
.blk-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.blk-label{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.blk.needs,.blk.pv{border-color:color-mix(in srgb,var(--accent) 42%,transparent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.blk.needs::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,var(--accent),transparent 80%)}
.blk-lead{font-size:14.5px;color:var(--ink-2)}
.q+.q{padding-top:14px;border-top:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.q-meta{font:400 11.5px/1.4 var(--mono);color:var(--helper)}
.q-meta b{color:var(--accent-hi);font-weight:500}
.q-text{margin-top:5px;font-size:16px;line-height:1.5;color:var(--ink)}
.q-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opt{min-height:42px;padding:9px 14px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-radius:var(--r);background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--accent-hi);font:500 14.5px/1.3 var(--sans);text-align:left;max-width:100%;overflow-wrap:anywhere}
.opt:hover{background:color-mix(in srgb,var(--accent) 17%,transparent)}
.q-free{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.q-free textarea{flex:1;min-width:0}
.q-free .btn{min-height:42px}
.contract-box{padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(0,0,0,.22)}
.err-text{font-size:15px;color:var(--burgundy-hi);overflow-wrap:anywhere}
.pv-open{display:flex;align-items:center;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;min-height:54px;padding:12px 14px;border:1px solid var(--green);border-radius:var(--r);background:rgba(95,155,114,.13);color:var(--green-hi);text-decoration:none}
.pv-open:hover{background:rgba(95,155,114,.21)}
.pv-open .st{font-size:13px}
.pv-host{font:500 14px/1.3 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.logins ul{list-style:none;padding:0;margin-top:6px;font:400 13px/1.55 var(--mono);color:var(--ink-2)}
.logins li{overflow-wrap:anywhere}
.logins li+li{margin-top:2px}
.pv-until{font-size:14px;color:var(--ink-2)}
.pv-until b{font-family:var(--mono);font-weight:500}
.pv-note{font-size:13.5px;color:var(--muted)}
.pv-err{display:block;margin-top:6px;font:400 12.5px/1.5 var(--mono);color:var(--burgundy-hi);overflow-wrap:anywhere}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid rgba(193,85,107,.55);border-radius:var(--r);background:rgba(193,85,107,.07)}
.confirm>span{font-size:14.5px;color:var(--burgundy-hi)}
.confirm.calm{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.confirm.calm>span{color:var(--ink)}
.opt.pick{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.opt .pick-tag{display:inline-block;margin-left:8px;padding:0 5px;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:2px;font:500 10px/1.55 var(--mono);letter-spacing:.08em;text-transform:uppercase;vertical-align:1px;white-space:nowrap}
/* discussion: design rounds before a plan */
.blk.dz.you{border-color:color-mix(in srgb,var(--accent) 42%,transparent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.blk.dz.you::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,var(--accent),transparent 80%)}
.blk.dz .blk-top .st{font-size:12px}
.dz-cost{font:400 11.5px/1.3 var(--mono);color:var(--helper)}
.dz-state>*+*{margin-top:8px}
.dz-state>.dz-sub{margin-top:4px}
.dz-line{font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.dz-sub{margin-top:4px;font-size:13px;line-height:1.5;color:var(--muted)}
.dz-focus{font-size:13.5px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.dz-focus .label{margin-right:6px;font-size:10.5px}
.dz-round{padding-top:14px;border-top:1px solid var(--line-soft)}
.dz-round>*+*{margin-top:8px}
.dz-rh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font:400 11.5px/1.4 var(--mono);color:var(--helper)}
.dz-rh h4{font:500 18px/1.2 var(--serif);letter-spacing:-.005em;color:var(--ink)}
.dz-rh>span::before{content:"·";margin-right:10px;color:#6b6b74}
.dz-rh .tag.ok{color:var(--green-hi);border-color:rgba(95,155,114,.5)}
.dz-sum{font-size:14.5px;line-height:1.55;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.dz-sum.clamp{max-height:calc(14.5px * 1.55 * 8);overflow:hidden}
.dz-sum.clamp.cut{-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.q-why{margin-top:4px;font-size:14px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.dz-more{margin-top:2px!important;font-size:13px}
.dz-btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dz-btns .btn{text-transform:none;letter-spacing:.02em;font-size:12.5px}
.dz-check{font:400 12px/1.5 var(--mono);color:var(--helper);overflow-wrap:anywhere}
.dz-check ul{margin-top:2px;padding-left:16px}
.dz-qs{padding-top:14px;border-top:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.dz-qs>*+*{margin-top:12px}
.dz-step{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line-soft)}
.dz-next{display:flex;flex-direction:column;gap:7px}
.dz-earlier{padding-top:16px;border-top:1px solid var(--line-soft)}
.dz-earlier>.label{display:block}
.dz-earlier .dz-round{border-top:0;padding-top:10px}
.dz-earlier .dz-round+.dz-round{border-top:1px solid var(--line-soft);padding-top:14px;margin-top:14px}
.changes{display:flex;flex-direction:column;gap:8px}
.settings{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;padding-top:14px;border-top:1px solid var(--line-soft)}
.set{display:flex;flex-direction:column;gap:6px;min-width:0}
.notebox{display:flex;flex-direction:column;gap:6px}
.note-row{display:flex;gap:8px;align-items:flex-end}
.note-row textarea{flex:1;min-width:0}
.note-row .btn{min-height:42px}
.tabs-wrap{margin-top:24px}
.tabstrip{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip [role="tab"]{flex:none;min-height:42px;padding:8px 12px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:500 13.5px/1 var(--sans);white-space:nowrap}
.tabstrip [role="tab"]:hover{color:var(--ink-2)}
.tabstrip [role="tab"][aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink-2)}
.tabstrip [role="tab"]:focus-visible{outline-offset:-2px}
.tabstrip .cnt{margin-left:6px;font:500 11px/1 var(--mono);color:var(--helper)}
.tabpanel{padding-top:18px}
.tabpanel>*+*{margin-top:14px}
.empty-note{font:italic 400 16px/1.5 var(--serif);color:var(--helper)}
.verdict-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.tl{list-style:none;padding:0}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.ev:first-child{padding-top:0}
.ev-when{font:400 12px/1.5 var(--mono);color:var(--helper)}
.ev-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.ev-who{font:600 13px/1.4 var(--sans);color:var(--ink-2)}
.ev-type{font:400 11px/1.4 var(--mono);color:var(--helper)}
.ev-text{display:block;margin-top:2px;font-size:14px;line-height:1.5;color:var(--ink-2);overflow-wrap:anywhere;white-space:pre-line}
.ev[data-type="question"] .ev-type,.ev[data-type="escalate"] .ev-type,.ev[data-type="feedback"] .ev-type{color:var(--gold-hi)}
.ev[data-type="verdict"] .ev-type,.ev[data-type="answer"] .ev-type,.ev[data-type="decision"] .ev-type{color:var(--green-hi)}
.ev[data-type="preview"] .ev-type,.ev[data-type="discussion"] .ev-type,.ev[data-type="designer"] .ev-type{color:var(--violet-hi)}
.qa-q,.qa-d{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.qa-q:first-of-type,.qa-d:first-of-type{padding-top:4px}
.qa-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font:400 11.5px/1.4 var(--mono);color:var(--helper)}
.qa-meta b{color:var(--ink-2);font-weight:500}
.qa-q .md{margin-top:5px}
.qa-opts{margin-top:5px;font-size:13px;color:var(--helper)}
.qa-a{margin-top:6px;font-size:14.5px;color:var(--green-hi)}
.qa-a .who{color:var(--helper);font:400 11.5px/1.4 var(--mono)}
.qa-d p{font-size:14.5px;color:var(--ink-2);margin-top:4px}
.qa-h{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--helper)}
.runs>*+*{margin-top:12px}
.run{padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel)}
.run-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-size:13px}
.run-top b{font:600 13px/1 var(--mono)}
.logs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.logs .btn{text-transform:none;letter-spacing:.02em;font-size:12px}
.gate .checks{list-style:none;padding:0;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px}
.gate .checks li{display:inline-flex;gap:8px;align-items:baseline;font-size:12.5px}

/* ---- modals: new item, log ---- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(4,4,6,.74)}
.sheet{width:min(560px,100%);max-height:calc(100dvh - 48px);overflow:auto;padding:20px 22px 22px;background:#101013;border:1px solid var(--line);border-radius:var(--r)}
.sheet>*+*{margin-top:16px}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{flex:1;font:500 26px/1.15 var(--serif);letter-spacing:-.01em}
.fs{border:0;margin:0;padding:0;min-width:0}
.fs legend,.fld>.label{display:block;margin-bottom:7px;padding:0}
.fld{display:block}
.segr{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.segr.four{grid-template-columns:repeat(4,1fr)}
.segr.three{grid-template-columns:repeat(3,1fr)}
.segr label{position:relative;min-width:0}
.segr label+label{border-left:1px solid var(--line)}
.segr input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.segr span{display:flex;align-items:center;justify-content:center;min-height:42px;padding:0 6px;border-bottom:2px solid transparent;color:var(--muted);font:500 14px/1.2 var(--sans);cursor:pointer;white-space:nowrap}
.segr span small{margin-left:6px;font:400 11px/1 var(--mono);color:var(--helper)}
.segr label:hover span{color:var(--ink-2);background:var(--panel)}
.segr input:checked+span{background:rgba(var(--t),.08);color:var(--ink);border-bottom-color:var(--gold)}
.segr input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line-soft);border-radius:var(--r);cursor:pointer}
.check input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold)}
.check b{display:block;font-weight:500;color:var(--ink)}
.check small{display:block;margin-top:3px;font-size:13px;line-height:1.45;color:var(--muted)}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.sheet-foot .btn{min-height:42px}

<body>
<header class="bar" id="bar">
  <div class="in">
    <a class="brand" href="#" aria-label="hqrCrew board"><span aria-hidden="true">▚</span>hqrCrew</a>
    <span class="proj" id="proj" hidden></span>
    <button type="button" class="runchip" id="runchip" data-act="menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="runmenu"><i class="dot" aria-hidden="true"></i><span class="txt" id="runtxt">Runner</span><span class="caret" aria-hidden="true">▾</span></button>
    <div class="meters" id="meters"></div>
    <button type="button" class="labchip" id="labchip" data-act="lab-menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="labmenu" hidden><i class="dot" aria-hidden="true"></i><span>Lab</span><span class="lt" id="labtxt"></span></button>
    <div class="pvs" id="pvs"></div>
    <span class="grow sp"></span>

    <button type="button" class="btn topbtn" id="btn-chat" data-act="chat" aria-label="Chat with the lead" title="Chat with the lead (C)" aria-expanded="false" aria-controls="chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/></svg><span class="lbl">Chat</span><i class="cdot" aria-hidden="true"></i></button>
    <span class="brk" aria-hidden="true"></span>
  </div>
</header>

<div class="app" id="app">
  <main class="main" id="main" aria-label="Board">
    <div class="tabs" id="tabs" role="tablist" aria-label="Board columns"></div>
    <div class="board" id="board"></div>
    <details class="parked" id="parked" hidden>
      <summary><span>Parked</span> <b id="parked-n">0</b> <span class="ph">set aside, not in the queue</span></summary>
      <div class="parked-list" id="parked-list"></div>

  </main>

  <aside class="chat" id="chat" aria-labelledby="chat-h" hidden>
    <div class="chat-head">
      <button type="button" class="ibtn only-phone" data-act="close-chat" aria-label="Back to the board">←</button>
      <h2 id="chat-h">Lead</h2>
      <span class="st" id="lead-st">idle</span>
      <span class="grow"></span>
      <span class="chat-meta" id="lead-meta"></span>
      <button type="button" class="ibtn only-desk" data-act="close-chat" aria-label="Close the chat">×</button>

      <button type="submit" class="btn acc solid" data-zone="amber">Send</button>

</div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dr-title" hidden>
  <div class="dr-head" id="dr-head"></div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<div class="menu" id="runmenu" role="dialog" aria-label="Night-shift runner" hidden></div>
<div class="menu" id="labmenu" role="dialog" aria-label="Lab: today's app with the demo data" hidden></div>

<div class="modal" id="new-modal" hidden>
  <form class="sheet" id="new-form" role="dialog" aria-modal="true" aria-labelledby="new-h" novalidate>
    <div class="sheet-head">
      <h2 id="new-h">New item</h2>
      <button type="button" class="ibtn" data-act="close-top" aria-label="Close">×</button>
    </div>
    <label class="fld" for="new-project" id="new-proj-wrap" hidden><span class="label">Project</span>

      <legend class="label">Type</legend>

        <label><input type="radio" name="type" value="feature"><span>Feature</span></label>
        <label><input type="radio" name="type" value="idea"><span>Idea</span></label>
        <label><input type="radio" name="type" value="chore"><span>Chore</span></label>
      </div>
    </fieldset>
    <label class="fld" for="new-title"><span class="label">Title</span>
      <input type="text" id="new-title" name="title" maxlength="200" autocomplete="off" placeholder="What is it, in one line" required>
    </label>
    <div class="fld"><label class="label" for="new-body">Details</label>
      <div class="tbox" id="new-body-box"><textarea id="new-body" name="body" rows="5" placeholder="What happens, where, and what you expected. Links and file names help."></textarea></div>
    </div>
    <fieldset class="fs">
      <legend class="label">Priority</legend>
      <div class="segr three">
        <label><input type="radio" name="priority" value="1"><span>P1<small>high</small></span></label>
        <label><input type="radio" name="priority" value="2" checked><span>P2<small>normal</small></span></label>
        <label><input type="radio" name="priority" value="3"><span>P3<small>low</small></span></label>
      </div>
    </fieldset>
    <label class="check" for="new-discuss">
      <input type="checkbox" id="new-discuss" name="discuss">
      <span><b>Discuss first</b><small>A designer drafts a page with options, mockups and numbered decisions. You answer and accept a round; only then does the lead plan the build.</small></span>

    <label class="check" for="new-shape" id="new-shape-wrap">
      <input type="checkbox" id="new-shape" name="shape" checked>
      <span><b>Let the lead shape it</b><small>The lead reads the code, asks only what you must decide, and writes the contract.</small></span>
    </label>
    <div class="sheet-foot">
      <button type="button" class="btn" data-act="close-top">Cancel</button>
      <button type="submit" class="btn acc solid" id="new-submit" data-zone="amber">Add bug</button>
    </div>
  </form>
</div>

<div class="modal" id="log-modal" hidden>
  <div class="sheet log" role="dialog" aria-modal="true" aria-labelledby="log-h">

      <div class="grow" style="min-width:0"><h2 id="log-h">Log</h2><div class="sub" id="log-sub"></div></div>

      <button type="button" class="ibtn" data-act="log-close" id="log-close" aria-label="Close the log">×</button>

    <pre class="logpre" id="log-pre" tabindex="0"></pre>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
// Build DOM safely: strings become text nodes, attributes go through setAttribute.
function add(el, kids) {
  for (const k of kids) {
    if (k == null || k === false || k === '') continue;
    if (Array.isArray(k)) add(el, k);
    else el.append(k instanceof Node ? k : String(k));
  }
}
// replaceChildren() would print null/false as text; this skips them like h() does.
function fill(el, ...kids) { el.replaceChildren(); add(el, kids); return el; }
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const key of Object.keys(attrs)) {
    const v = attrs[key];
    if (v == null || v === false) continue;
    if (key === 'class') el.className = v;
    else if (key === 'value') el.value = v;
    else if (v === true) el.setAttribute(key, '');
    else el.setAttribute(key, String(v));
  }
  add(el, kids);
  return el;
}
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const ss = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
};
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function parse(s) { try { return JSON.parse(s); } catch { return null; } }
function autosize(el) {
  if (!el || el.tagName !== 'TEXTAREA') return;
  el.style.height = 'auto';
  const max = el.id === 'chat-in' ? 180 : 320;
  el.style.height = Math.min(el.scrollHeight + 2, max) + 'px';
}

/* ================= time (in the server's time zone) ================= */
let tz = 'Europe/Warsaw';
const fmts = {};
function dtf(opts) {
  const k = tz + JSON.stringify(opts);
  if (!fmts[k]) {
    try { fmts[k] = new Intl.DateTimeFormat('en-GB', { timeZone: tz, ...opts }); }
    catch { fmts[k] = new Intl.DateTimeFormat('en-GB', opts); }
  }
  return fmts[k];
}
const toDate = (iso) => { const d = new Date(iso); return isNaN(d) ? null : d; };
const clock = (d) => dtf({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d);
const dayKey = (d) => dtf({ year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
// "20:19" today, "Tue 20:19" within a week, "Tue 12 Oct 20:19" further away.
function when(iso) {
  const d = toDate(iso); if (!d) return '';
  const now = new Date();
  if (dayKey(d) === dayKey(now)) return clock(d);
  const wd = dtf({ weekday: 'short' }).format(d);
  if (Math.abs(d - now) < 6.5 * 864e5) return wd + ' ' + clock(d);
  return wd + ' ' + dtf({ day: 'numeric', month: 'short' }).format(d) + ' ' + clock(d);
}
function fullTime(iso) {
  const d = toDate(iso); if (!d) return '';
  return dtf({ weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d) + ' (' + tz + ')';
}
function dayLabel(iso) {
  const d = toDate(iso); if (!d) return '';
  const k = dayKey(d);
  if (k === dayKey(new Date())) return 'Today';
  if (k === dayKey(new Date(Date.now() - 864e5))) return 'Yesterday';
  return dtf({ weekday: 'short', day: 'numeric', month: 'short' }).format(d);
}
function ago(iso, short) {
  const d = toDate(iso); if (!d) return '';
  const s = Math.max(0, Math.round((Date.now() - d) / 1000));
  const tail = short ? '' : ' ago';
  if (s < 60) return short ? s + 's' : 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm' + tail;
  if (s < 86400) { const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60); return hh + 'h' + (mm ? ' ' + mm + 'm' : '') + tail; }
  return Math.round(s / 86400) + 'd' + tail;
}
function dur(ms) {
  if (!(ms >= 0)) return '';
  const m = Math.round(ms / 60000);
  if (m < 1) return Math.max(1, Math.round(ms / 1000)) + 's';
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';

async function api(path, method = 'GET', body) {
  const opt = { method, headers: { Accept: 'application/json' } };
  if (method !== 'GET') {
    opt.headers['X-Crew'] = '1';
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body || {});
  }
  let res;
  try { res = await fetch(path, opt); }
  catch { throw new Error('Cannot reach the crew server. Check that crew serve is running.'); }
  const type = res.headers.get('content-type') || '';
  let data = null;
  try { data = type.includes('application/json') ? await res.json() : await res.text(); } catch {}
  if (!res.ok) throw new Error((data && data.error) || (typeof data === 'string' && data.trim().slice(0, 300)) || 'The server answered ' + res.status + '.');
  return data;
}

/* ================= ticket actions ================= */
async function doAction(action, extra = {}) {
  const id = S.ticketId;
  if (!id) return;
  const key = 'act:' + id + ':' + action;
  if (S.busy.has(key)) return;
  S.busy.add(key);
  renderTicket(true);
  let ok = false;
  try {
    const r = await api(tpath(id, '/action'), 'POST', { action, ...extra });
    ok = true;
    if (action === 'drop' || action === 'accept') S.confirm = null;
    if (action === 'changes') { S.changesOpen = false; delete S.drafts['chg:' + id]; }
    if (action === 'note') delete S.drafts['note:' + id];
    if (action === 'discuss') delete S.drafts['dz:' + id];
    const done = DONE[action];
    toast(id + ': ' + (typeof done === 'function' ? done(r && r.state) : done || 'done.'));
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    S.busy.delete(key);
    if (S.ticketId === id) await loadTicket(id, { quiet: true, force: true });
    scheduleState();
  }
  // The round controls just used are gone now: show where the discussion stands.
  if (ok && (action === 'discuss' || action === 'accept') && S.ticketId === id) focusKey('dz-h');
}

    scheduleState();
  }

async function previewOp(op) {
  const id = S.ticketId;
  if (!id) return;
  const key = 'pv:' + id;
  if (S.busy.has(key)) return;
  S.busy.add(key);
  renderTicket(true);

    await api(tpath(id, '/preview'), 'POST', { op });

  } catch (e) {
    toast(e.message, 'error');

    if (S.ticketId === id) await loadTicket(id, { quiet: true, force: true });
    scheduleState();

async function pvWatch(id) {
  const since = S.pvPending[id];
  if (!since) return;
  try {
    const t = await api(tpath(id));
    const pv = (t.state && t.state.preview) || {};
    if (['starting', 'building', 'up', 'failed'].includes(pv.state) && (!pv.updated || new Date(pv.updated).getTime() >= since - 3000)) {
      delete S.pvPending[id];
      return;
    }
  } catch {}

  }

  if (m.role === 'user') {

  }
  if (m.role === 'lead') { S.lead.partial = ''; S.lead.tools = []; }
  S.chat.push(m);
  if (S.chat.length > 400) S.chat.splice(0, S.chat.length - 400);
  stickChat(() => { appendMsg(m); renderPending(); renderTyping(); }, mine);

/* ================= dictation (Web Speech API) =================
   One recognition at a time. Interim words show at the end of the box and are replaced as they firm up;
   final words stay. The target is found by its draft key on every result, so a ticket view that

// The microphone needs a secure context (https, or localhost); elsewhere dictation cannot work, so no mic.
const SR = window.isSecureContext === false ? null : window.SpeechRecognition || window.webkitSpeechRecognition || null;

    const p = document.createElementNS(NS, 'path');

}
function micBtn(key) {

}
// A text box with a mic in its corner. key: the textarea's draft key (or its id when it has none).
function tbox(ta, key) { return h('div', { class: 'tbox' }, ta, micBtn(key)); }
function langBtn() {
  const en = V.lang.startsWith('en');

function renderVoice() {

const voiceTarget = (key) => $('textarea[data-draft="' + CSS.escape(key) + '"]') || document.getElementById(key);

  const key = V.key;

  if (V.shown && cur.endsWith(V.shown)) cur = cur.slice(0, cur.length - V.shown.length);
  fin = String(fin || '').replace(/\s+/g, ' ').trim();
  mid = String(mid || '').replace(/\s+/g, ' ').trim();

  V.shown = mid ? (cur && !/\s$/.test(cur) ? ' ' : '') + mid : '';

  if (el) {
    el.value = val;
    // The same path as typing: the draft is saved and the box grows.
    el.dispatchEvent(new Event('input', { bubbles: true }));

function voiceError(code) {

    case 'not-allowed':
    case 'service-not-allowed': return 'The microphone is blocked for this page. Allow it in the browser’s site settings, then tap the mic again.';
    case 'no-speech': return 'No speech heard. Tap the mic and speak.';
    case 'audio-capture': return 'No microphone found.';
    case 'network': return 'Dictation needs a network connection.';
    case 'language-not-supported': return 'This browser cannot take dictation in ' + langName() + '. Switch the language next to the chat mic.';

/* ================= routing (#PA-008, #chat, #new) ================= */
// history.state.stack lists the routes of the entries below this one ('' = the board), nearest last.
function curRoute() { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; } }
function navStack() { const st = history.state; return st && Array.isArray(st.stack) ? st.stack : []; }
const home = () => location.pathname + location.search;
function nav(hash, { replace = false } = {}) {
  const cur = curRoute();
  const stack = navStack();
  if (!hash) {
    if (stack.length) history.go(-stack.length);
    else { history.replaceState({ stack: [] }, '', home()); route(); }
    return;
  }
  if (hash === cur) { route(); return; }
  const url = '#' + encodeURIComponent(hash);
  // Ticket to ticket replaces, so Back and Esc do not walk through every card you looked at.
  if (replace || (TICKET_RE.test(cur) && TICKET_RE.test(hash))) history.replaceState({ stack }, '', url);
  else history.pushState({ stack: stack.concat([cur]) }, '', url);
  route();
}
// Esc and the close buttons. A ticket closes to whatever it was opened from (the board or the chat),
// past any ticket it was opened over (New from a ticket); other layers step back once.
function closeTop() {
  const cur = curRoute();
  const stack = navStack();
  let n = 0;
  if (TICKET_RE.test(cur)) {
    for (let i = stack.length - 1; i >= 0; i--) { n++; if (!TICKET_RE.test(stack[i]) && stack[i] !== 'new') break; }
  } else if (cur && stack.length) n = 1;
  if (n) history.go(-n);
  else { history.replaceState({ stack: [] }, '', home()); route(); }
}
function lockScroll() {
  const modal = !$('#new-modal').hidden || !$('#log-modal').hidden;
  document.documentElement.classList.toggle('lock', modal || (isPhone() && (!!S.ticketId || S.chatPhone)));
}
function route() {
  const r = curRoute();
  const stack = navStack();
  const phone = isPhone();
  if (r === 'chat' && !phone) {
    history.replaceState({ stack }, '', home());
    setChatPanel(true);
    return route();
  }
  S.chatPhone = phone && (r === 'chat' || stack[stack.length - 1] === 'chat');
  if (TICKET_RE.test(r)) openTicketView(r.toUpperCase());
  else closeTicketView();
  if (r === 'new') openNew();
  else closeNew();
  applyChat();
  lockScroll();
  voiceCheck();
}

/* ================= live updates ================= */
let es = null;
let esRetry = 1000;
let esTimer = null;
let everLive = false;
function onFeed(ev) {
  const d = parse(ev.data);
  if (!d) return;
  if (d.ticket) S.flash[d.ticket] = Date.now();
  scheduleState();
  if (d.ticket && d.ticket === S.ticketId) {
    if (d.type === 'preview') delete S.pvPending[d.ticket];
    scheduleTicket();
  }
}
function connect() {
  clearTimeout(esTimer);
  if (es) { try { es.close(); } catch {} }
  let src;
  try { src = new EventSource('/api/events'); }
  catch { setLive('reconnecting'); esTimer = setTimeout(connect, esRetry); return; }
  es = src;
  src.addEventListener('hello', () => {
    esRetry = 1000;
    const again = everLive;
    everLive = true;
    setLive('live');
    if (again) { loadState(); loadChat(); if (S.ticketId) loadTicket(S.ticketId, { quiet: true }); }
  });
  src.addEventListener('feed', onFeed);
  src.addEventListener('chat', (ev) => handleChat(parse(ev.data)));
  src.addEventListener('runner', (ev) => {
    const r = parse(ev.data);
    if (r && S.state) {
      const was = (S.state.runner && S.state.runner.current) || null;
      S.state.runner = r;
      renderBar();
      // A design round moving on (design → check → publish) writes no feed event; the runner's own update says so.
      const cur = r.current;
      if (cur && cur.kind === 'design' && (!was || was.ticket !== cur.ticket || was.step !== cur.step)) {
        scheduleState();
        if (cur.ticket === S.ticketId) scheduleTicket();
      }
      // A queued design round says what the runner is doing.
      const d = S.ticket && S.ticket.state && S.ticket.state.discussion;
      if (d && d.state === 'queued') renderTicket();
    }
  });
  src.addEventListener('lab', (ev) => {
    const l = parse(ev.data);
    if (Array.isArray(l) && S.state) { S.state.lab = l; renderBar(); }
  });
  src.addEventListener('previews', (ev) => {
    const p = parse(ev.data);
    if (Array.isArray(p) && S.state) { S.state.previews = p; renderBar(); if (S.ticket) renderTicket(); }
  });
  src.onerror = () => {
    if (es !== src) return;
    setLive('reconnecting');
    if (src.readyState === 2) {
      esTimer = setTimeout(connect, esRetry);
      esRetry = Math.min(esRetry * 2, 30000);
    }
  };
}
function tickTimes() {
  $$('[data-ago]').forEach((el) => { el.textContent = ago(el.dataset.ago); });
  renderBar();
}

/* ================= events ================= */
function trapFocus(root, e) {
  const els = $$('a[href], button:not([disabled]), textarea, input:not([type="hidden"]), select, [tabindex]:not([tabindex="-1"])', root).filter((x) => x.offsetParent !== null || x === document.activeElement);
  if (!els.length) return;
  const first = els[0];
  const last = els[els.length - 1];
  if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) { e.preventDefault(); last.focus(); }

}

  const a = e.target.closest('a[href^="#"]');

    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    closeMenu();
    closeLab();
    nav(curRouteOf(a.getAttribute('href')));
    return;
  }
  const menu = $('#runmenu');
  if (!menu.hidden && !e.target.closest('#runmenu') && !e.target.closest('[data-act="menu"]')) closeMenu();
  const lab = $('#labmenu');
  if (!lab.hidden && !e.target.closest('#labmenu') && !e.target.closest('[data-act="lab-menu"]')) closeLab();
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const id = S.ticketId;
  switch (b.dataset.act) {
    case 'menu': if (menu.hidden) openMenu(); else closeMenu(); return;
    case 'lab-menu': if (lab.hidden) openLab(); else closeLab(); return;
    case 'lab': labOp(b.dataset.project, b.dataset.op); return;
    case 'mic': toggleVoice(b.dataset.mic); return;
    case 'vlang': toggleLang(); return;
    case 'dz-send': sendDiscuss(); return;
    case 'dz-retry': { const d = S.ticket && S.ticket.state.discussion; doAction('discuss', { note: String((d && d.pending && d.pending.note) || '').trim() }); return; }
    case 'dz-more': if (id) { const k = id + ':' + b.dataset.n; S.dzOpen[k] = !S.dzOpen[k]; renderTicket(true); focusKey('dz-more-' + b.dataset.n); } return;
    case 'dz-accept-ask': S.confirm = S.confirm === 'accept' ? null : 'accept'; renderTicket(true); focusKey(S.confirm ? 'dz-accept-no' : 'dz-accept'); return;
    case 'dz-accept-cancel': S.confirm = null; renderTicket(true); focusKey('dz-accept'); return;
    case 'dz-accept': doAction('accept', { round: Number(b.dataset.round) }); return;
    case 'new': closeMenu(); closeLab(); nav('new'); return;
    case 'chat': closeMenu(); closeLab(); toggleChat(); return;
    case 'close-chat': closeChat(); return;
    case 'close-top': closeTop(); return;
    case 'board-tab': setBoardTab(b.dataset.tab); return;
    case 'tab': if (id) { S.tabs[id] = b.dataset.tab; S.tabPicked[id] = true; renderTicket(true); focusKey('tab-' + b.dataset.tab); } return;
    case 'answer': answer(b.dataset.q, b.dataset.text); return;
    case 'answer-free': answer(b.dataset.q, S.drafts['ans:' + id + ':' + b.dataset.q] || ''); return;
    case 'action': doAction(b.dataset.action); return;
    case 'drop-ask': S.confirm = S.confirm === 'drop' ? null : 'drop'; renderTicket(true); focusKey(S.confirm ? 'drop-no' : 'act-drop'); return;
    case 'drop-cancel': S.confirm = null; renderTicket(true); focusKey('act-drop'); return;
    case 'changes-toggle': S.changesOpen = !S.changesOpen; renderTicket(true); focusKey(S.changesOpen ? 'chg:' + id : 'act-changes'); return;
    case 'changes-send': sendChanges(); return;
    case 'note-add': addNote(); return;
    case 'approval': if (b.getAttribute('aria-pressed') !== 'true') doAction('approval', { value: b.dataset.value }); return;
    case 'pv': previewOp(b.dataset.op); return;
    case 'log': openLog(id, b.dataset.run, b.dataset.file); return;
    case 'log-refresh': if (S.log) openLog(S.log.id, S.log.run, S.log.file, S.log.tail); return;
    case 'log-more': if (S.log) openLog(S.log.id, S.log.run, S.log.file, 4000); return;
    case 'log-close': closeLog(); return;
    case 'copy': copyText(b.dataset.copy || ''); return;
    case 'mode': runnerPost({ mode: b.dataset.mode }, 'Runner mode: ' + b.dataset.mode + '.'); return;
    case 'clear-park': runnerPost({ clearPark: true }, 'Usage park cleared. The runner tries again on its next check.'); return;
    case 'clear-auth': runnerPost({ clearAuth: true }, 'Login problem cleared. Log in on the box if it comes back.'); return;
    case 'wake': runnerPost({ wake: true }, 'Asked the runner to check the queue now.'); return;
    case 'chat-retry': retryChat(Number(b.dataset.id)); return;
    case 'reload': loadState(); return;
    case 'newmsg': { const log = $('#chat-log'); log.scrollTop = log.scrollHeight; b.hidden = true; return; }
    default:
  }
}
function curRouteOf(href) { try { return decodeURIComponent(String(href || '').replace(/^#/, '')); } catch { return ''; } }
function onKey(e) {
  if (e.key === 'Escape') {
    if (V.rec && e.target.closest && e.target.closest('.mic')) { e.preventDefault(); stopVoice(); return; }
    if (!$('#log-modal').hidden) { e.preventDefault(); closeLog(); return; }
    if (!$('#runmenu').hidden) { e.preventDefault(); closeMenu(true); return; }
    if (!$('#labmenu').hidden) { e.preventDefault(); closeLab(true); return; }
    if (S.confirm && S.ticketId) { e.preventDefault(); const k = S.confirm === 'accept' ? 'dz-accept' : 'act-drop'; S.confirm = null; renderTicket(true); focusKey(k); return; }
    if (curRoute()) { e.preventDefault(); closeTop(); return; }
    if (!isPhone() && S.chatPanel && $('#chat').contains(document.activeElement)) { e.preventDefault(); closeChat(); }
    return;
  }
  if (e.key === 'Tab') {
    const m = !$('#log-modal').hidden ? $('#log-modal') : !$('#new-modal').hidden ? $('#new-modal') : !$('#runmenu').hidden || !$('#labmenu').hidden ? null : (isPhone() && S.ticketId) ? $('#drawer') : null;
    if (m) trapFocus(m, e);
    return;
  }
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const tabs = $$('[role="tab"]', tab.parentElement);
    let i = tabs.indexOf(tab);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault();
    tabs[i].click();
    tabs[i].focus();
    return;
  }
  const t = e.target;
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && t.dataset && t.dataset.draft) {
    const k = t.dataset.draft;
    if (k.startsWith('ans:')) { e.preventDefault(); answer(k.split(':')[2], t.value); }
    else if (k.startsWith('note:')) { e.preventDefault(); addNote(); }
    else if (k.startsWith('chg:')) { e.preventDefault(); sendChanges(); }
    else if (k.startsWith('dz:')) { e.preventDefault(); sendDiscuss(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (t.closest && t.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (!$('#new-modal').hidden || !$('#log-modal').hidden) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); nav('new'); }
  else if ((e.key === 'c' || e.key === 'C') && !isPhone()) { e.preventDefault(); toggleChat(); }
}
function onInput(e) {
  const el = e.target;
  if (el.dataset && el.dataset.draft) S.drafts[el.dataset.draft] = el.value;
  if (el.tagName === 'TEXTAREA') autosize(el);
}
function onChange(e) {
  const el = e.target;
  if (el.dataset && el.dataset.change === 'priority') {
    const v = Number(el.value);
    if (S.ticket && S.ticket.state.priority !== v) doAction('priority', { value: v });
  }
  if (el.name === 'type' && el.form && el.form.id === 'new-form') { updateNewLabel(); syncDiscuss(); }
  if (el.id === 'new-discuss') { S.newDiscussSet = true; syncDiscuss(); }
}

/* ================= init ================= */
function init() {
  // A shared link like /#PA-008 gets the board underneath it, so Back and Esc land on the board.
  const first = curRoute();
  try {
    history.replaceState({ stack: [] }, '', home());
    if (first) history.pushState({ stack: [''] }, '', '#' + encodeURIComponent(first));
  } catch {}
  const bar = $('#bar');
  const setBarH = () => document.documentElement.style.setProperty('--barh', bar.offsetHeight + 'px');
  setBarH();
  if ('ResizeObserver' in window) new ResizeObserver(setBarH).observe(bar);
  $('#board').replaceChildren(h('p', { class: 'board-msg' }, 'Loading the board…'));
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  window.addEventListener('popstate', route);
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', () => {
    if (!$('#runmenu').hidden) placeMenu();
    if (!$('#labmenu').hidden) placeMenu('#labmenu', '#labchip');
  });
  initVoice();
  $('#chat-form').addEventListener('submit', (e) => { e.preventDefault(); sendChat(); });
  $('#chat-in').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); sendChat(); }
  });
  $('#chat-log').addEventListener('scroll', () => { if (nearBottom($('#chat-log'))) $('#newmsg').hidden = true; }, { passive: true });
  $('#new-form').addEventListener('submit', (e) => { e.preventDefault(); submitNew(); });
  $('#new-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeTop(); });
  $('#log-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeLog(); });
  $('#drawer').addEventListener('focusout', () => {
    // Catch up on updates that arrived while typing, once the click that moved focus has landed.
    setTimeout(() => { if (S.ticketDirty && !typingIn($('#drawer'))) renderTicket(); }, 400);
  });
  mqPhone.addEventListener('change', () => { route(); if (S.ticketId) { $('#drawer').setAttribute('aria-modal', isPhone() ? 'true' : 'false'); renderTicket(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') { stopVoice(); return; }
    loadState();
    loadChat();
    if (S.ticketId) loadTicket(S.ticketId, { quiet: true });
    if (!es || es.readyState === 2) connect();
  });
  route();
  applyChat();
  loadState();
  loadChat();
  connect();
  setInterval(tickTimes, 20000);
  setInterval(() => { if (S.live !== 'live') loadState(); }, 30000);
}
init();
})();
</script>
